<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalendir</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <h2>Kalendir</h2>
        Välkomen till din nya fina kalender!
        
        <br><br>

        <label for="CalSorceTextfield">TimeEdit iCal länk:</label>
        <input type="text" id="CalSorceTextfield" value="https://cloud.timeedit.net/liu/web/schema/ri667XQ1021Z53Qm2Z0506Z6y6YQ100n6Y94Y0gQ20.ics">
        <button id="LoadCalBtn">Lägg till kalender</button>
        
        <br><br>

        <div id="courseList"></div>

        <br><br>

        <button id="uploadBtn">Spara</button>

        <br><br>

        <div id="calendar"></div>

    </div>


    <!-- Kopplar in JavaScript-filen -->

    <script type="module" src="script.js"></script>
    <script type="module" src="front.js"></script>
    <script type="module" src="server.js"></script>
