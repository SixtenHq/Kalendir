<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalendir</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body> 

    <div class="box">

        <h2>Kalendir Alpha</h2>
        Välkomen till din nya fina kalender!
        
        <br><br>

        <span class="info">
            i
            <span class="tooltip">Add a subsription link from TimeEdit to get started, you can add several</span>
        </span>
        <label for="CalSorceTextfield">TimeEdit iCal länk:</label>
        <input type="text" id="CalSorceTextfield" value="">
        <button id="LoadCalBtn">Lägg till kalender</button>
        
        <br><br>

        <span class="info">
            i
            <span class="tooltip">Add a link you got from Kalendir to continue edeting it</span>
        </span>
        <label for="InternalCalTextField">Kalendir länk:</label>
        <input type="text" id="InternalCalTextField" value="">
        <button id="InternalCalBtn">Hämta kalender</button>
        
        <br><hr><br>

        <div id="sourceList"></div>

        <br><hr><br>

        <div id="courseList"></div>

        <br><hr><br>
        
        <div id="excludeList"></div>

        <br><hr><br>

        <div id="categorieList"></div>

        <br><hr><br>

        <div id="subLinkList"></div>

        <br><hr><br>

        <button id="uploadBtn">Spara</button>
        <br>
        <label id="kalendirLinkLabel"></label>

        <br><hr><br>

        <div id="calendar"></div>

    </div>


    <!-- Kopplar in JavaScript-filen -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
    <script type="module" src="site/front.js"></script>
    <script type="module" src="site/server.js"></script>

</body>
</html>
